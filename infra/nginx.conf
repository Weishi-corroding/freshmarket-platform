limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = /healthz { access_log off; return 200 'ok'; }
    location = /api/metrics { return 404; }
    # 生产网关不公开接口文档（开发环境仍可在 :3001/api/docs 查看）
    location ^~ /api/docs { return 404; }
    location = /api/openapi.json { return 404; }
    location ~ ^/api/(auth/(login|register)|admin/auth/login)$ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 覆盖而非追加客户端地址，API 以 TRUST_PROXY=1 只信任这一跳，限流按真实客户端计数
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        # 安全响应头统一由网关下发，隐藏 API(helmet) 的同名头，避免重复与冲突
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 覆盖而非追加客户端地址，API 以 TRUST_PROXY=1 只信任这一跳，限流按真实客户端计数
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        # 安全响应头统一由网关下发，隐藏 API(helmet) 的同名头，避免重复与冲突
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /images/ { expires 1d; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
