name: FreshMarket checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: freshmarket_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm test
        env: {TEST_DATABASE_URL: "postgres://test:test@localhost:5432/freshmarket_test"}
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: sh scripts/test-ops.sh
      - run: docker compose config --quiet
        env: {DB_PASSWORD: ci-db-only, JWT_SECRET: ci-key-only-change-for-production-123456, MQ_PASSWORD: ci-mq-only, GRAFANA_PASSWORD: ci-grafana-only, DEMO_PASSWORD: CIOnlyDemo12345}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freshmarket-evidence
          path: |
            docs/evidence/
            docs/screenshots/
            test-results/
